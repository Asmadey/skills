<!-- 
  Open Graph Template
  Copy this block into <head> section of each page.
  Replace all [PLACEHOLDERS] with actual values.
-->

<!-- Required: Add prefix to html tag -->
<!-- <html lang="ru" prefix="og: https://ogp.me/ns#"> -->

<!-- ============================================= -->
<!-- OPEN GRAPH TAGS                               -->
<!-- ============================================= -->

<!-- Basic OG Tags -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="[SITE_NAME]" />
<meta property="og:url" content="[FULL_PAGE_URL]" />
<meta property="og:title" content="[PAGE_TITLE - max 60-95 chars]" />
<meta property="og:description" content="[PAGE_DESCRIPTION - max 200 chars]" />
<meta property="og:locale" content="ru_RU" />

<!-- OG Image (REQUIRED: absolute HTTPS URL) -->
<meta property="og:image" content="[FULL_IMAGE_URL]" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:alt" content="[IMAGE_ALT_TEXT]" />

<!-- ============================================= -->
<!-- TWITTER CARD TAGS                             -->
<!-- ============================================= -->

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="[PAGE_TITLE]" />
<meta name="twitter:description" content="[PAGE_DESCRIPTION]" />
<meta name="twitter:image" content="[FULL_IMAGE_URL]" />

<!-- Optional: Twitter Site & Creator -->
<!-- <meta name="twitter:site" content="@your_twitter_handle" /> -->
<!-- <meta name="twitter:creator" content="@author_twitter_handle" /> -->
