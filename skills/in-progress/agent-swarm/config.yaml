# swarm-config.yaml
swarm:
  max_agents: 100
  max_parallel_tools: 1500
  default_timeout: 120
  aggregation_strategy: "synthesize"
  
rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 100000
  
tools:
  enabled:
    - web_search
    - execute_code
    - read_file
    - write_file
    - query_database
    - call_api
  
  config:
    web_search:
      provider: "serper"
      max_results: 10
    
    execute_code:
      sandbox: "e2b"
      timeout: 30
